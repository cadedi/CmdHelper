name: Build and Release Matrix

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Cross-Platform Single-File Artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore and Build
        shell: pwsh
        run: |
          .\build.ps1
          .\build-avalonia.ps1

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CmdHelper-Release-Deliverables
          path: release/*
